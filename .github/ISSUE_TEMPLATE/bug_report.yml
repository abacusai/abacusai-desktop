name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - VS Code extension
        - CLI
        - Desktop app
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Run `abacusai --version`, or check the extension version in VS Code's Extensions view.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Windows 11, Ubuntu 24.04, WSL...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Remove anything sensitive before posting.
      render: text
